name: APK install + launch test (x86_64 emulator + ARM translation)

on:
  workflow_dispatch:

jobs:
  test-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System info
        run: |
          uname -m
          nproc
          free -g
          df -h .
          ls /dev/kvm 2>&1 || echo "NO /dev/kvm"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK cmdline tools (Linux x86_64)
        run: |
          set -e
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          curl -sL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "system-images;android-34;google_apis;x86_64" "emulator" "build-tools;34.0.0"
          echo "=== sdkmanager list installed ==="
          sdkmanager --list_installed

      - name: Reassemble APK from repo chunks
        run: |
          set -e
          ls apk/app.apk.part.* | wc -l
          cat apk/app.apk.part.* > app.apk
          ls -la app.apk
          echo "=== sha256 ==="
          sha256sum app.apk
          echo "=== expected sha256 starts with f8b70280, size 325317645 ==="
          test "$(stat -c%s app.apk)" = "325317645" && echo "SIZE OK" || echo "SIZE MISMATCH"

      - name: Static APK verification
        run: |
          set -e
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH
          echo "=== aapt2 badging ==="
          aapt2 dump badging app.apk | head -n 8
          echo "=== apksigner verify ==="
          apksigner verify --verbose app.apk | head -n 8
          echo "=== manifest split checks ==="
          aapt2 dump xmltree app.apk --file AndroidManifest.xml | grep -E "requiredSplitTypes|splitTypes|package=|sharedUserId|extractNativeLibs" | head -n 8

      - name: Create and boot x86_64 emulator
        run: |
          set -e
          # avdmanager (Java/XDG) creates AVDs under ~/.config/.android/avd, but the emulator binary
          # defaults to ~/.android/avd. Force both to the XDG path.
          export ANDROID_AVD_HOME=$HOME/.config/.android/avd
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH
          echo "no" | avdmanager create avd -n test -k "system-images;android-34;google_apis;x86_64" -d "pixel_7" --force
          echo "=== AVD created ==="
          avdmanager list avd
          echo "=== AVD home: $ANDROID_AVD_HOME ==="
          ls "$ANDROID_AVD_HOME/" || true
          echo "=== KVM permissions (runner user is not in kvm group; x86_64 emulator requires KVM) ==="
          ls -l /dev/kvm || echo "no /dev/kvm"
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm
          nohup emulator -avd test -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -memory 2048 -cores 2 > emulator.log 2>&1 &
          echo $! > emulator.pid
          echo "emulator started, waiting for device (timeout 180s)..."
          timeout 180 adb wait-for-device || echo "adb wait-for-device timed out or failed (rc=$?)"
          echo "=== emulator.log tail ==="
          tail -n 30 emulator.log || true
          echo "=== adb devices ==="
          timeout 30 adb devices || true
          echo "=== waiting for boot (up to 15 min) ==="
          for i in $(seq 1 90); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || echo "")
            if [ "$BOOT" = "1" ]; then
              echo "BOOT COMPLETED after ${i} x 10s"
              break
            fi
            if [ $((i % 6)) -eq 0 ]; then echo "waiting... ${i}0s elapsed, boot_completed=$BOOT"; fi
            sleep 10
          done
          echo "=== boot_completed ==="
          adb shell getprop sys.boot_completed || echo "getprop failed"
          echo "=== device ==="
          adb shell getprop ro.product.model || true
          adb shell getprop ro.product.cpu.abi || true
          adb shell getprop ro.build.version.sdk || true
          echo "=== ARM translation (native bridge) present? ==="
          adb shell getprop ro.dalvik.vm.native.bridge || echo "no native.bridge prop"
          adb shell ls /system/lib64/libhoudini.so 2>/dev/null || adb shell ls /system/lib/libhoudini.so 2>/dev/null || echo "no houdini .so found"

      - name: Install APK and launch app
        run: |
          set -e
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          mkdir -p results
          echo "=== device check ==="
          timeout 30 adb devices || true
          if ! timeout 30 adb shell true 2>/dev/null; then
            echo "ERROR: no responsive device; skipping install/launch"
            echo "no device" > results/install.log
            echo "1" > results/install_rc.txt
            echo "no device" > results/launch.log
            echo "NO DEVICE" > results/logcat_filtered.txt
            echo "" > results/logcat_full.txt
            exit 1
          fi
          echo "=== INSTALL (adb install, timeout 900s) ==="
          set +e
          timeout 900 adb install -r -g app.apk > results/install.log 2>&1
          INSTALL_RC=$?
          set -e
          cat results/install.log
          echo "install exit code: $INSTALL_RC"
          echo "$INSTALL_RC" > results/install_rc.txt
          echo "=== package present? ==="
          timeout 30 adb shell pm list packages | grep officehubrow || echo "PACKAGE NOT LISTED"
          echo "=== LAUNCH ==="
          timeout 30 adb logcat -c || true
          set +e
          timeout 60 adb shell monkey -p com.microsoft.office.officehubrow.patch -c android.intent.category.LAUNCHER 1 > results/launch.log 2>&1
          LAUNCH_RC=$?
          set -e
          cat results/launch.log
          echo "launch (monkey) exit code: $LAUNCH_RC"
          echo "=== wait 30s for app to settle ==="
          sleep 30
          echo "=== current focused activity ==="
          timeout 30 adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" | head -n 5 || true
          echo "=== app process running? ==="
          timeout 30 adb shell ps -A | grep -i officehubrow || echo "NO officehubrow PROCESS"
          echo "=== screenshot ==="
          timeout 60 adb exec-out screencap -p > results/screenshot.png || true
          ls -la results/screenshot.png || true
          echo "=== logcat (filtered) ==="
          timeout 60 adb logcat -d > results/logcat_full.txt || true
          grep -iE "officehubrow|AndroidRuntime|FATAL|crash|Exception" results/logcat_full.txt | tail -n 100 > results/logcat_filtered.txt || true
          wc -l results/logcat_full.txt results/logcat_filtered.txt || true
          cat results/logcat_filtered.txt | head -n 60 || true

      - name: Write result summary
        if: always()
        run: |
          mkdir -p results
          {
            echo "# APK test result (x86_64 emulator + ARM translation)"
            echo ""
            echo "- APK: m365copilot-16.0.20625.20022-single-patch.apk (sha256 f8b70280...)"
            echo "- Package: com.microsoft.office.officehubrow.patch"
            echo "- Runner: ubuntu-24.04 (x86_64), emulator x86_64 API 34 google_apis"
            echo "- NOTE: arm64 APK on x86_64 emulator uses ARM translation (houdini). Install success proves the APK is structurally valid; launch via translation is a bonus, not a guarantee of native ARM64 behavior."
            echo ""
            echo "## Install"
            echo ""
            echo '```'
            cat results/install.log 2>/dev/null || echo "(no install.log)"
            echo '```'
            echo ""
            echo "install exit code: $(cat results/install_rc.txt 2>/dev/null || echo '?')"
            echo ""
            echo "## Launch"
            echo ""
            echo '```'
            cat results/launch.log 2>/dev/null || echo "(no launch.log)"
            echo '```'
            echo ""
            echo "## Focused activity / process"
            echo ""
            echo '```'
            timeout 30 adb shell dumpsys window 2>/dev/null | grep -E "mCurrentFocus|mFocusedApp" | head -n 5 || echo "(emulator gone)"
            timeout 30 adb shell ps -A 2>/dev/null | grep -i officehubrow || echo "NO officehubrow PROCESS"
            echo '```'
            echo ""
            echo "## Filtered logcat"
            echo ""
            echo '```'
            cat results/logcat_filtered.txt 2>/dev/null | head -n 80 || echo "(no logcat)"
            echo '```'
          } > results/RESULT.md
          cat results/RESULT.md

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-test-results
          path: results/
          retention-days: 7
