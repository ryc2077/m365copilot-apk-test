name: APK install + launch test (ARM64 macOS)

on:
  workflow_dispatch:

jobs:
  test-apk:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System info
        run: |
          uname -m
          sysctl -n hw.ncpu
          df -h .
          ls /dev/kvm 2>&1 || echo "no /dev/kvm (macOS uses Hypervisor.framework)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK cmdline tools (macOS ARM64)
        run: |
          set -e
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          curl -sL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip
          unzip -q cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "system-images;android-34;google_apis;arm64-v8a" "emulator" "build-tools;34.0.0"
          echo "=== sdkmanager list installed ==="
          sdkmanager --list_installed

      - name: Download APK from Google Drive
        run: |
          set -e
          pip3 install -q gdown
          gdown --fuzzy "https://drive.google.com/file/d/14P_WTYyPaQG1vhZMyQsJ1zR3X6P9tr0G/view?usp=drivesdk" -O app.apk
          ls -la app.apk
          echo "=== sha256 ==="
          shasum -a 256 app.apk
          echo "=== expected sha256 starts with 24cb4647, size 325317645 ==="
          test "$(stat -f%z app.apk)" = "325317645" && echo "SIZE OK" || echo "SIZE MISMATCH"

      - name: Static APK verification
        run: |
          set -e
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH
          echo "=== aapt2 badging ==="
          aapt2 dump badging app.apk | head -n 8
          echo "=== apksigner verify ==="
          apksigner verify --verbose app.apk | head -n 8
          echo "=== manifest split checks ==="
          aapt2 dump xmltree app.apk --file AndroidManifest.xml | grep -E "requiredSplitTypes|splitTypes|package=|sharedUserId|extractNativeLibs" | head -n 8

      - name: Create and boot ARM64 emulator
        run: |
          set -e
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH
          echo "no" | avdmanager create avd -n test -k "system-images;android-34;google_apis;arm64-v8a" -d "pixel_7" --force
          echo "=== AVD created ==="
          avdmanager list avd
          echo "hw.ramSize=2048" >> ~/.android/avd/test.avd/config.ini
          echo "hw.cpu.ncore=2" >> ~/.android/avd/test.avd/config.ini
          echo "disk.dataPartition.size=2048M" >> ~/.android/avd/test.avd/config.ini
          nohup emulator -avd test -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -memory 2048 -cores 2 > emulator.log 2>&1 &
          echo $! > emulator.pid
          echo "emulator started, waiting for boot (up to 30 min)..."
          adb wait-for-device
          for i in $(seq 1 180); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || echo "")
            if [ "$BOOT" = "1" ]; then
              echo "BOOT COMPLETED after ${i} x 10s"
              break
            fi
            if [ $((i % 6)) -eq 0 ]; then echo "waiting... ${i}0s elapsed, boot_completed=$BOOT"; fi
            sleep 10
          done
          echo "=== boot_completed ==="
          adb shell getprop sys.boot_completed
          echo "=== device ==="
          adb shell getprop ro.product.model
          adb shell getprop ro.product.cpu.abi
          adb shell getprop ro.build.version.sdk

      - name: Install APK and launch app
        run: |
          set -e
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          mkdir -p results
          echo "=== INSTALL (adb install) ==="
          set +e
          adb install -r -g app.apk > results/install.log 2>&1
          INSTALL_RC=$?
          set -e
          cat results/install.log
          echo "install exit code: $INSTALL_RC"
          echo "$INSTALL_RC" > results/install_rc.txt
          echo "=== package present? ==="
          adb shell pm list packages | grep officehubrow || echo "PACKAGE NOT LISTED"
          echo "=== LAUNCH ==="
          adb logcat -c
          set +e
          adb shell monkey -p com.microsoft.office.officehubrow.patch -c android.intent.category.LAUNCHER 1 > results/launch.log 2>&1
          LAUNCH_RC=$?
          set -e
          cat results/launch.log
          echo "launch (monkey) exit code: $LAUNCH_RC"
          echo "=== wait 25s for app to settle ==="
          sleep 25
          echo "=== current focused activity ==="
          adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" | head -n 5
          echo "=== app process running? ==="
          adb shell ps -A | grep -i officehubrow || echo "NO officehubrow PROCESS"
          echo "=== screenshot ==="
          adb exec-out screencap -p > results/screenshot.png
          ls -la results/screenshot.png
          echo "=== logcat (last 300 lines, filtered) ==="
          adb logcat -d > results/logcat_full.txt
          grep -iE "officehubrow|AndroidRuntime|FATAL|crash|Exception" results/logcat_full.txt | tail -n 100 > results/logcat_filtered.txt || true
          wc -l results/logcat_full.txt results/logcat_filtered.txt
          cat results/logcat_filtered.txt | head -n 60

      - name: Write result summary
        if: always()
        run: |
          mkdir -p results
          {
            echo "# APK test result"
            echo ""
            echo "- APK: m365copilot-16.0.20625.20022-single-patch.apk (sha256 24cb4647...)"
            echo "- Package: com.microsoft.office.officehubrow.patch"
            echo "- Runner: macos-15 (Apple Silicon ARM64)"
            echo ""
            echo "## Install"
            echo ""
            echo '```'
            cat results/install.log 2>/dev/null || echo "(no install.log)"
            echo '```'
            echo ""
            echo "install exit code: $(cat results/install_rc.txt 2>/dev/null || echo '?')"
            echo ""
            echo "## Launch"
            echo ""
            echo '```'
            cat results/launch.log 2>/dev/null || echo "(no launch.log)"
            echo '```'
            echo ""
            echo "## Focused activity / process"
            echo ""
            echo '```'
            adb shell dumpsys window 2>/dev/null | grep -E "mCurrentFocus|mFocusedApp" | head -n 5 || echo "(emulator gone)"
            adb shell ps -A 2>/dev/null | grep -i officehubrow || echo "NO officehubrow PROCESS"
            echo '```'
            echo ""
            echo "## Filtered logcat"
            echo ""
            echo '```'
            cat results/logcat_filtered.txt 2>/dev/null | head -n 80 || echo "(no logcat)"
            echo '```'
          } > results/RESULT.md
          cat results/RESULT.md

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-test-results
          path: results/
          retention-days: 7
